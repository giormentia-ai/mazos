<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis mazos</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #EDE9DF;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 20px;
  }
  #app { width: 100%; max-width: 380px; }

  /* ---- HOME ---- */
  #topIndexLink {
    display: inline-block;
    font-family: -apple-system, sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: #6B6555;
    text-decoration: none;
    margin-bottom: 14px;
  }
  #topIndexLink2 {
    margin-left: auto;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #6B6555;
    text-decoration: none;
    padding: 10px 4px 10px 14px;
    min-height: 40px;
    display: flex;
    align-items: center;
  }
  #home h1 {
    font-size: 22px;
    margin: 0 0 4px 0;
    color: #2C2A24;
  }
  #home p.sub {
    font-family: -apple-system, sans-serif;
    font-size: 12.5px;
    color: #A39D8C;
    margin: 0 0 20px 0;
  }
  .deck-tile {
    background: #FFFEFA;
    border: 1px solid #D8D2C2;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .deck-tile:active {
    transform: scale(0.98);
  }
  .deck-left { display:flex; align-items:center; gap: 12px; }
  .deck-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }
  .deck-name {
    font-size: 17px;
    color: #2C2A24;
  }
  .deck-meta {
    font-family: -apple-system, sans-serif;
    font-size: 11.5px;
    color: #A39D8C;
    text-align: right;
    line-height: 1.4;
  }
  .chev { color: #C9C2AF; font-size: 18px; margin-left: 10px; }

  /* ---- DECK VIEW ---- */
  #deckView { display: none; }
  #topBar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    font-family: -apple-system, sans-serif;
    position: relative;
    z-index: 20;
  }
  #backBtn {
    font-size: 14px;
    font-weight: 600;
    color: #6B6555;
    cursor: pointer;
    padding: 10px 14px 10px 4px;
    margin: -10px 0 -10px -4px;
    min-height: 40px;
    display: flex;
    align-items: center;
  }
  #deckTitle {
    font-size: 14px;
    font-weight: 600;
    color: #2C2A24;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 300px;
    user-select: none;
    touch-action: pan-y;
  }
  .stack {
    position: absolute;
    inset: 0;
    background: #FBF9F4;
    border: 1px solid #D8D2C2;
    border-radius: 10px;
  }
  #back2 { transform: translateY(14px) scale(0.94); }
  #back1 { transform: translateY(7px) scale(0.97); }
  #card {
    position: absolute;
    inset: 0;
    background: #FFFEFA;
    border: 1px solid #D8D2C2;
    border-radius: 10px;
    padding: 22px 26px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.18s ease, opacity 0.18s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  #head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  #tag {
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  #counter {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    color: #A39D8C;
  }
  #body {
    flex: 1;
    display: flex;
    align-items: center;
  }
  #content {
    font-size: 17px;
    line-height: 1.55;
    color: #2C2A24;
    margin: 0;
  }
  #hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #B5AF9E;
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    margin-top: 10px;
    text-align: center;
  }
  #siFlag {
    position: absolute; top: 18px; left: 18px;
    font-family: -apple-system, sans-serif;
    font-size: 11px; font-weight: 700; color: #2E7D4F;
    opacity: 0; transition: opacity 0.12s ease; letter-spacing: 0.04em;
  }
  #noFlag {
    position: absolute; top: 18px; right: 18px;
    font-family: -apple-system, sans-serif;
    font-size: 11px; font-weight: 700; color: #B0473F;
    opacity: 0; transition: opacity 0.12s ease; letter-spacing: 0.04em;
  }
  #sobraFlag {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    font-family: -apple-system, sans-serif;
    font-size: 11px; font-weight: 700; color: #6B6555;
    opacity: 0; transition: opacity 0.12s ease; letter-spacing: 0.04em;
  }
  #pinBadge {
    position: absolute;
    bottom: 14px;
    right: 18px;
    font-size: 15px;
    color: #C99A2E;
    display: none;
  }
  #deckStats {
    text-align: center;
    font-family: -apple-system, sans-serif;
    font-size: 11.5px;
    color: #A39D8C;
    margin-bottom: 14px;
    line-height: 1.8;
  }
  #statLinks span { text-decoration: underline; cursor: pointer; }
  #studyActions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  #studyActions button {
    flex: 1;
    font-family: -apple-system, sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    padding: 11px 8px;
    border-radius: 10px;
    cursor: pointer;
    min-height: 42px;
  }
  #btnNo { background: #FBF1EE; border: 1px solid #E3C1B8; color: #8A3A2A; }
  #btnSi { background: #EEF6F0; border: 1px solid #B9D9C0; color: #21603A; }
  #studyActions2 {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  #studyActions2 button {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #6B6555;
    background: #FBF9F4;
    border: 1px solid #D8D2C2;
    border-radius: 20px;
    padding: 8px 14px;
    min-height: 36px;
    cursor: pointer;
  }
  #keepBtn.pinned {
    background: #FBF1DC;
    border-color: #E0C88A;
    color: #8A6A18;
  }
  #resocontoBox {
    text-align: center;
    padding: 40px 10px;
    font-family: Georgia, serif;
  }
  #resocontoTexto {
    font-size: 16px;
    line-height: 1.6;
    color: #2C2A24;
    margin-bottom: 22px;
    white-space: pre-line;
  }
  #resocontoActions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  #resocontoActions button {
    font-family: -apple-system, sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 20px;
    cursor: pointer;
    min-width: 200px;
  }
  #btnRepasar { background: #2C2A24; color: #FFFEFA; border: 1px solid #2C2A24; }
  #btnVolverIndice { background: #FBF9F4; color: #6B6555; border: 1px solid #D8D2C2; }
  #listHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #2C2A24;
    margin-bottom: 10px;
  }
  #listCerrar { font-weight: 500; color: #A39D8C; cursor: pointer; }
  #listUl { list-style: none; margin: 0; padding: 0; }
  #listUl li {
    background: #FFFEFA;
    border: 1px solid #D8D2C2;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-family: Georgia, serif;
    font-size: 14px;
    color: #2C2A24;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  #listUl li .txt { flex: 1; line-height: 1.4; }
  #listUl li button {
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #6B6555;
    background: #F3F0E8;
    border: 1px solid #D8D2C2;
    border-radius: 14px;
    padding: 6px 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #listVacio {
    text-align: center;
    font-family: -apple-system, sans-serif;
    font-size: 12.5px;
    color: #A39D8C;
    margin-top: 20px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">

  <div id="home">
    <a id="topIndexLink" href="index.html">‹ índice de mazos</a>
    <h1 id="homeTitle">Mis mazos</h1>
    <p class="sub" id="homeSub">Tocá un mazo para repasarlo</p>
    <div id="deckList"></div>
  </div>

  <div id="deckView">
    <div id="topBar">
      <span id="backBtn">‹ atrás</span>
      <span id="deckTitle"></span>
      <a id="topIndexLink2" href="index.html">índice ›</a>
    </div>

      <span id="statLine"></span>
      <div id="statLinks">
        <span id="favLink">★ favoritas</span> · <span id="discardLink">descartadas</span> · <span id="resetProgLink">↺ reiniciar progreso</span>
      </div>
    </div>

    <div id="studyBox">
      <div id="stage">
        <div id="back2" class="stack"></div>
        <div id="back1" class="stack"></div>
        <div id="card">
          <div id="siFlag">ME SALE ›</div>
          <div id="noFlag">‹ NO ME SALE</div>
          <div id="sobraFlag">▲ DE SOBRA</div>
          <span id="pinBadge">★</span>
          <div id="head">
            <span id="tag"></span>
            <span id="counter"></span>
          </div>
          <div id="body">
            <p id="content"></p>
          </div>
          <div id="hint">tocá para pasar · deslizá a la derecha para repetirla · a la izquierda para sacarla del mazo</div>
        </div>
      </div>
      <div id="studyActions">
        <button id="btnNo">← no me sale</button>
        <button id="btnSi">me sale →</button>
      </div>
      <div id="studyActions2">
        <button id="keepBtn">☆ favorita</button>
        <button id="btnSobra">▲ la sé de sobra</button>
        <button id="btnVia">✕ no me interesa</button>
      </div>
    </div>

    <div id="resocontoBox" class="hidden">
      <p id="resocontoTexto"></p>
      <div id="resocontoActions">
        <button id="btnRepasar" class="primary">Repasar de nuevo</button>
        <button id="btnVolverIndice">Volver al mazo</button>
      </div>
    </div>

    <div id="listBox" class="hidden">
      <div id="listHeader">
        <span id="listTitulo"></span>
        <span id="listCerrar">✕ cerrar</span>
      </div>
      <ul id="listUl"></ul>
      <p id="listVacio" class="hidden">No hay tarjetas acá todavía.</p>
    </div>
  </div>

</div>

    type: "qa",

    cards: [
      {cat:"italiano", q:"Me prometió que me llamaría al llegar.", a:"Tu respuesta: «Mi promise che mi chiamasse al arrivare» — incorrecta.<br>Correcto: «Mi promise che mi <strong>avrebbe chiamato appena arrivato</strong>».<br>Explicación: prometer no lleva congiuntivo, se usa condizionale (aquí passato); «al arrivare» no existe, es «appena arrivato»."},
      {cat:"italiano", q:"Contadino", a:"labrador."},
      {cat:"italiano", q:"Estaba seguro de que ella habría aceptado.", a:"Tu respuesta: «Ero sicuro che ella aveva accettato» — incorrecta.<br>Correcto: «Ero sicuro che lei <strong>avrebbe accettato</strong>»."},
      {cat:"italiano", q:"Perciò", a:"por lo tanto, por consiguiente, por eso. Ej: \"La polizia non ha trovato prove che fu lui a commettere l'omicidio, perciò non fu arrestato.\" / \"Penso, perciò sono.\""},
      {cat:"italiano", q:"Avrei voluto che tu me l'___ prima, non a cose fatte.", a:"Pusiste: «avessi detto» — correcta.<br>Explicación: acá el decir es anterior a la preferencia → trapassato."},
      {cat:"italiano", q:"Ci mancherebbe", a:"faltaría más, no hay de qué."},
      {cat:"italiano", q:"Di fila", a:"seguido. Ej: \"Terzo mondiale di fila senza azzurra.\""},
      {cat:"italiano", q:"Cosicché", a:"así que, de manera que / para que. Ej: \"Deve avvicinarsi cosicché lui possa ascoltare bene.\" / \"Io studio economia, cosicché sono in effetti un economista.\""},
      {cat:"italiano", q:"Avrei preferito che tu me lo ___ di persona, guardandomi in faccia.", a:"Pusiste: «avessi detto» — incorrecta.<br>Correcto: «<strong>dicessi</strong>».<br>Explicación: el decírtelo es simultáneo a la preferencia → imperfetto, no trapassato."},
      {cat:"italiano", q:"Ovvero", a:"mejor dicho, o sea, es decir."},
      {cat:"italiano", q:"Finché", a:"1) mientras. Ej: \"Finché vivi sotto il mio tetto, obbedirai alle mie regole.\" 2) hasta. Ej: \"La polizia non verrà finché le condizioni meteo non miglioreranno.\""},
      {cat:"italiano", q:"Comunque", a:"todas las acepciones (de todos modos, en fin, igualmente)."},
      {cat:"italiano", q:"Estaba seguro de que ellos ganarían el partido.", a:"Tu respuesta: «Ero sicuro che loro vincerebbero la partita» — incorrecta.<br>Correcto: «Ero sicuro che loro <strong>avrebbero vinto</strong>».<br>Explicación: «vincerebbero» es calco del español; certeza + futuro nel passato → condizionale passato."},
      {cat:"italiano", q:"Sfumatura", a:"matiz (también en sentido figurado)."},
      {cat:"italiano", q:"Tra l'altro", a:"entre otras cosas."},
      {cat:"italiano", q:"Ravvicinare", a:"acercar."},
      {cat:"italiano", q:"Altrettanto", a:"lo mismo / igualmente. Ej: \"Non posso dire altrettanto di te.\" / \"Spingersi più lontano sarebbe altrettanto irresponsabile.\" / \"Tanti auguri! — Grazie, altrettanto!\""},
      {cat:"italiano", q:"Guarire", a:"sanar, curar."}
    ]
  },

      {cat:"ingles", q:"Grievance", a:"motivo de queja."},
      {cat:"ingles", q:"Horsefly", a:"tábano."},
      {cat:"ingles", q:"To amend", a:"cambiar, modificar, enmendar."},
      {cat:"ingles", q:"To spot", a:"detectar, divisar."},
      {cat:"ingles", q:"Arrange for (the dinner)", a:"Organizar, coordinar (la cena)."},
      {cat:"ingles", q:"Copycat", a:"una copia."},
      {cat:"ingles", q:"When the chips are down", a:"en el momento crítico, cuando las cosas se ponen difíciles."},
      {cat:"ingles", q:"Compelling", a:"convincente. Ej: Compelling evidence / Compelling argument."},
      {cat:"ingles", q:"Put me down for sth", a:"anotame."},
      {cat:"ingles", q:"Rebate", a:"reembolso, devolución."},
      {cat:"ingles", q:"What's the downside?", a:"el lado negativo, la desventaja."},
      {cat:"ingles", q:"Forthcoming", a:"siguiente, venidero, disponible. Ej: Kyle went to buy some supplies for the forthcoming events. / Since state educational funding wasn't forthcoming, students had to find other ways to pay for university."},
      {cat:"ingles", q:"Bankable", a:"rentable."},
      {cat:"ingles", q:"To stack the deck (against sbd/sth)", a:"jugar en contra de algo/alguien. The deck is stacked against smn: las cosas están en contra de alguien."},
      {cat:"ingles", q:"Swathe (sueiz)", a:"tira, franja."},
      {cat:"ingles", q:"To get hung up on something", a:"preocuparse excesiva o irracionalmente por algo, quedarse pegado. Ej: I don't wanna get too hung up on this but… / Don't get hung up on the small details; we need to focus on the big picture."},
      {cat:"ingles", q:"With regard(s) to", a:"con respecto a."},
      {cat:"ingles", q:"Relentless", a:"incansable, incesante."},
      {cat:"ingles", q:"Let bygones be bygones", a:"dejar atrás el pasado, hacer borrón y cuenta nueva."},
      {cat:"ingles", q:"Clearance", a:"autorización, permiso, acceso."},
      {cat:"ingles", q:"To get the edge", a:"sacar ventaja (en una negociación)."},
      {cat:"ingles", q:"Getting around something", a:"sortear, evitar."},
      {cat:"ingles", q:"For that matter", a:"si vamos al caso. Ej: I know she doesn't like his music — for that matter, neither do I. / The only guarantee that Bosnia or Kosovo, or the entire Balkans for that matter, will not go up in flames again tomorrow."},
      {cat:"ingles", q:"Dairy (deri)", a:"lácteo."},
      {cat:"ingles", q:"To daunt", a:"intimidar, atemorizar. Daunting: abrumador, intimidante, desalentador."},
      {cat:"ingles", q:"Doggedly", a:"empecinadamente, insistentemente, tercamente."},
      {cat:"ingles", q:"To churn out", a:"producir en masa. Ej: Argentina still churns out plenty of characterless bottles."},
      {cat:"ingles", q:"Out of thin air", a:"de golpe, de la nada."},
      {cat:"ingles", q:"Dire straits", a:"en apuros, en aprietos. Ej: …the economy is still in dire straits."},
      {cat:"ingles", q:"To appraise", a:"valorar, juzgar."},
      {cat:"ingles", q:"Fluff", a:"pelusa / algo sin valor, que sobra."},
      {cat:"ingles", q:"Down the line", a:"más adelante, a futuro."},
      {cat:"ingles", q:"Top notch", a:"de primera calidad."},
      {cat:"ingles", q:"Due diligence", a:"las comprobaciones debidas. Chequeo de información sobre una persona, empresa o negocio, previo a firmar un contrato."},
      {cat:"ingles", q:"Beat a dead horse", a:"gastar energía en algo que no tiene sentido."},
      {cat:"ingles", q:"To face sb/sth down", a:"enfrentarlo, encararlo."}
    ]
  },

  {cat:"negocios", text:"Lagging indicators: la métrica ex post (ej. ventas). Leading indicators: la métrica ex ante (leads creados, llamadas, etc)."},

  {cat:"negocios", text:"Sesgo de actualidad (recency bias): dar más peso a la información reciente por sobre la histórica."},
  {cat:"cultura", text:"El 80% de la población de India es hinduista. El 15% es musulmán."},
  {cat:"cultura", text:"En China no hay una religión principal única, sino un sincretismo de budismo, taoísmo y confucianismo."},
  {cat:"cultura", text:"El tasbih es el rosario que usan los turcos."},

  {cat:"ciencia", text:"A Sócrates lo sentenciaron a muerte y le hicieron tomar veneno de cicuta (hemlock), que paraliza el cuerpo."},

  {cat:"cultura", text:"El pájaro conocido como \"bicho feo\" es el bienteveo, también llamado pitohué."},

  {cat:"historia", text:"Los askenazíes son los judíos que se asentaron en Europa central, sobre todo Alemania. Desarrollaron su propio idioma: el ídish."},
  {cat:"historia", text:"Los mizrajíes son los judíos de Oriente Medio y el norte de África."},
  {cat:"historia", text:"El macartismo refiere a acusaciones de deslealtad o traición sin debido proceso. Se originó en EE. UU. (1950-1956) con el senador Joseph McCarthy, persiguiendo a supuestos comunistas. Inspiró \"Las brujas de Salem\" de Arthur Miller."},
  {cat:"historia", text:"Hezbollah: partido chiita libanés con brazo político y militar, financiado por Irán y apoyado por Siria. Tiene bancas en el parlamento y controla regiones del Líbano."},
  {cat:"historia", text:"Estado Islámico: grupo terrorista paramilitar sunita yihadista, con sede en Mosul, Irak."},
  {cat:"historia", text:"El éxodo jujeño recorrió 250 km."},
  {cat:"historia", text:"El ejército de los Andes de San Martín tenía 5000 hombres."},
  {cat:"historia", text:"El cruce de los Andes se hizo en 6 cruces distintos y simultáneos."},
  {cat:"filosofia", text:"Solipsismo: doctrina filosófica que defiende que el sujeto pensante no puede afirmar ninguna existencia salvo la suya propia."},
  {cat:"filosofia", text:"Eclecticismo: escuela filosófica nacida en Grecia que escoge, sin principios determinados, ideas y valoraciones de otras escuelas, combinándolas aunque el resultado no forme un todo orgánico."},
  {cat:"filosofia", text:"Agnosticismo: sostiene que no hay evidencia suficiente para tomar partido por una hipótesis determinada. Para Dawkins, la existencia o no de dios es una hipótesis científica como cualquier otra."},
  {cat:"reflexion", text:"Hay que ser distintos. Pero una cosa es ser distintos desde la audacia y otra es serlo desde el desconocimiento."},
  {cat:"reflexion", text:"J. M. Keynes: no hay nada peor que un mal aguantable."},
  {cat:"reflexion", text:"El mejor momento para plantar un árbol fue hace 20 años; el segundo mejor momento es ahora."},
  {cat:"negocios", text:"Ley de Metcalfe: el valor de una red es proporcional al cuadrado del número de participantes."},
  {cat:"negocios", text:"Vanity metrics (métricas de vanidad): métricas fáciles de medir o monitorizar que pueden dar una falsa impresión de crecimiento."},
  {cat:"negocios", text:"MoSCoW: must-have, should-have, could-have y won't-have (o will not have right now)."},
  {cat:"negocios", text:"Sell in: ventas del fabricante al canal (distribuidor, mayorista, retail), mide cuánto entra al punto de venta. Sell out: ventas del punto de venta al consumidor final, mide la demanda real."},

// ============ GRUPOS (para acceder filtrado desde el índice general) ============
const GROUPS = {
  'italiano-mas': { title: 'Más vocabulario', sub: 'Italiano — tarjetas sueltas', match: k => k.startsWith('italiano') },
  'ingles':       { title: 'Vocabulario inglés', sub: 'Inglés 1 a 6', match: k => k.startsWith('ingles') },
  'varios':       { title: 'Conocimiento general', sub: 'Varios', match: k => k.startsWith('varios') }
};
const urlParams = new URLSearchParams(window.location.search);
const activeGroupKey = urlParams.get('group');
const activeGroup = (activeGroupKey && GROUPS[activeGroupKey]) ? GROUPS[activeGroupKey] : null;

function visibleDeckKeys(){
  const keys = Object.keys(decks);
  return activeGroup ? keys.filter(activeGroup.match) : keys;
}

// ============ ESTADO POR TARJETA ============
// stato[deckKey][idx] = { descartada: null|"sobra"|"via", favorito: bool, dias: 0-3, giorno: "YYYY-MM-DD"|null }
let currentDeckKey = null;
let stato = {};        // estado del mazo actualmente abierto
let coda = [];          // cola de índices para esta sesión de estudio
let indice = 0;          // posición actual dentro de coda
let flipped = false;
let sessionAprendidas = 0; // cuántas llegaron a 3 días en esta sesión

const homeEl = document.getElementById('home');
const deckViewEl = document.getElementById('deckView');
const deckListEl = document.getElementById('deckList');
const card = document.getElementById('card');
const siFlag = document.getElementById('siFlag');
const noFlag = document.getElementById('noFlag');
const sobraFlag = document.getElementById('sobraFlag');
const studyBox = document.getElementById('studyBox');
const resocontoBox = document.getElementById('resocontoBox');
const listBox = document.getElementById('listBox');
const deckStatsEl = document.getElementById('deckStats');

function statoKey(deckKey){ return 'mazo_stato_' + deckKey; }
const oggi = () => new Date().toISOString().slice(0,10);

const hasClaudeStorage = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storeGet(key){
  if(hasClaudeStorage){
    try {
      const r = await window.storage.get(key, false);
      return (r && r.value) ? r.value : null;
    } catch(e) { /* cae al fallback */ }
  }
  try { return localStorage.getItem(key); } catch(e) { return null; }
}

async function storeSet(key, value){
  if(hasClaudeStorage){
    try { await window.storage.set(key, value, false); return; } catch(e) { /* cae al fallback */ }
  }
  try { localStorage.setItem(key, value); } catch(e) {}
}

async function loadStato(deckKey){
  const raw = await storeGet(statoKey(deckKey));
  if(!raw) return {};
  try { return JSON.parse(raw); } catch(e) { return {}; }
}

async function saveStato(){
  await storeSet(statoKey(currentDeckKey), JSON.stringify(stato));
}

// ============ HELPERS DE PROGRESO (igual que CELI4) ============
function get(idx){ return stato[idx] || {}; }
function isDescartada(idx){ return !!get(idx).descartada; }
function isFavorita(idx){ return !!get(idx).favorito; }
function prog(idx){ const s = get(idx); return {dias: s.dias||0, giorno: s.giorno||null}; }
function categoria(idx){
  if(isDescartada(idx)) return "descartada";
  const p = prog(idx);
  if(p.dias >= 3) return "aprendida";
  if(p.dias >= 1) return "proceso";
  return "pendiente";
}
function inGiro(idx){ const c = categoria(idx); return c === "pendiente" || c === "proceso"; }

function contaDeck(deckKey, deckStato){
  const deck = decks[deckKey];
  const c = {pendiente:0, proceso:0, aprendida:0, descartada:0, favorita:0};
  deck.cards.forEach((_, idx) => {
    const s = deckStato[idx] || {};
    if(s.descartada) c.descartada++;
    else if((s.dias||0) >= 3) c.aprendida++;
    else if((s.dias||0) >= 1) c.proceso++;
    else c.pendiente++;
    if(s.favorito) c.favorita++;
  });
  return c;
}

function cardLabel(deckKey, idx){
  const deck = decks[deckKey];
  const c = deck.cards[idx];
  return deck.type === 'qa' ? c.q : c.text.replace(/<[^>]+>/g,' ');
}

// ============ HOME ============
async function renderHome(){
  document.getElementById('homeTitle').textContent = activeGroup ? activeGroup.title : 'Mis mazos';
  document.getElementById('homeSub').textContent = activeGroup ? activeGroup.sub : 'Tocá un mazo para repasarlo';
  deckListEl.innerHTML = '';
  for(const key of visibleDeckKeys()){
    const deck = decks[key];
    const deckStato = await loadStato(key);
    const c = contaDeck(key, deckStato);
    const total = deck.cards.length;
    const enGiro = c.pendiente + c.proceso;
    const notes = [];
    if(c.aprendida) notes.push(c.aprendida + ' aprendidas');
    if(c.descartada) notes.push(c.descartada + ' descartadas');
    if(c.favorita) notes.push(c.favorita + ' favoritas');
    const tile = document.createElement('div');
    tile.className = 'deck-tile';
    tile.innerHTML = `
      <div class="deck-left">
        <div class="deck-dot" style="background:${deck.dot}"></div>
        <div class="deck-name">${deck.label}</div>
      </div>
      <div style="display:flex;align-items:center;">
        <div class="deck-meta">${enGiro} / ${total} en giro${notes.length ? '<br>' + notes.join(' · ') : ''}</div>
        <div class="chev">›</div>
      </div>
    `;
    tile.addEventListener('click', () => openDeck(key));
    deckListEl.appendChild(tile);
  }
}

// ============ ABRIR MAZO / EMPEZAR SESIÓN ============
async function openDeck(key){
  currentDeckKey = key;
  stato = await loadStato(key);
  homeEl.style.display = 'none';
  deckViewEl.style.display = 'block';
  document.getElementById('deckTitle').textContent = decks[key].label;
  iniciarSesion();
}

function iniciarSesion(){
  const deck = decks[currentDeckKey];
  coda = deck.cards.map((_, idx) => idx).filter(idx => inGiro(idx));
  for(let i = coda.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [coda[i], coda[j]] = [coda[j], coda[i]];
  }
  indice = 0;
  sessionAprendidas = 0;
  mostrarStats();
  if(coda.length === 0){
    mostrarResoconto(true);
  } else {
    studyBox.classList.remove('hidden');
    resocontoBox.classList.add('hidden');
    listBox.classList.add('hidden');
    disegnaCarta();
  }
}

function mostrarStats(){
  const c = contaDeck(currentDeckKey, stato);
  const total = decks[currentDeckKey].cards.length;
  document.getElementById('statLine').textContent =
    `${c.pendiente + c.proceso} en giro · ${c.aprendida} aprendidas · ${c.descartada} descartadas · ${c.favorita} favoritas · ${total} en total`;
}

// ============ TARJETA DE ESTUDIO ============
function disegnaCarta(){
  if(indice >= coda.length){ mostrarResoconto(false); return; }
  const deck = decks[currentDeckKey];
  const idx = coda[indice];
  const c = deck.cards[idx];
  flipped = false;

  const tagEl = document.getElementById('tag');
  const col = deck.tagColor ? deck.tagColor : deck.catColors[c.cat];
  tagEl.textContent = c.cat;
  tagEl.style.background = col.bg;
  tagEl.style.color = col.text;

  document.getElementById('pinBadge').style.display = isFavorita(idx) ? 'inline' : 'none';
  document.getElementById('content').innerHTML = deck.type === 'qa' ? c.q : c.text;
  document.getElementById('counter').textContent = (indice + 1) + ' / ' + coda.length;
  updateHint();
  updateKeepBtn();

  card.style.transition = 'none';
  card.style.transform = 'translateX(0) rotate(0deg)';
  card.style.opacity = '1';
  siFlag.style.opacity = 0; noFlag.style.opacity = 0; sobraFlag.style.opacity = 0;
  requestAnimationFrame(() => { card.style.transition = ''; });
}

function updateHint(){
  const deck = decks[currentDeckKey];
  const hintEl = document.getElementById('hint');
  if(deck.type === 'qa'){
    hintEl.textContent = flipped
      ? 'tocá para ver la pregunta · ← no me sale · me sale →'
      : 'tocá para ver la respuesta · ← no me sale · me sale →';
  } else {
    hintEl.textContent = '← no me sale · me sale → · ▲ la sé de sobra';
  }
}

function updateKeepBtn(){
  const idx = coda[indice];
  const btn = document.getElementById('keepBtn');
  const fav = isFavorita(idx);
  btn.textContent = fav ? '★ favorita — quitar' : '☆ favorita';
  btn.className = fav ? 'pinned' : '';
}

function toggleFlip(){
  const deck = decks[currentDeckKey];
  if(deck.type !== 'qa') return;
  const idx = coda[indice];
  const c = deck.cards[idx];
  flipped = !flipped;
  document.getElementById('content').innerHTML = flipped ? c.a : c.q;
  updateHint();
}

// esito: "no" | "si" | "sobra" | "via"
async function rispondi(esito){
  const deck = decks[currentDeckKey];
  if(deck.type === 'qa' && !flipped && (esito === 'no' || esito === 'si')){ toggleFlip(); return; }
  const idx = coda[indice];
  const s = stato[idx] ? {...stato[idx]} : {};

  if(esito === 'si' || esito === 'no'){
    if(esito === 'si'){
      if(s.giorno !== oggi()) s.dias = Math.min(3, (s.dias||0) + 1);
      if(s.dias >= 3) sessionAprendidas++;
    } else {
      s.dias = 0;
    }
    s.giorno = oggi();
  } else if(esito === 'sobra'){
    s.descartada = 'sobra';
  } else if(esito === 'via'){
    s.descartada = 'via';
  }
  stato[idx] = s;
  await saveStato();

  if(esito === 'sobra' || esito === 'via'){
    card.style.transform = 'translateY(-110%) scale(.94)';
  } else {
    card.style.transform = `translateX(${esito==='si'?'':'-'}120%) rotate(${esito==='si'?12:-12}deg)`;
  }
  card.style.opacity = '0';
  siFlag.style.opacity = 0; noFlag.style.opacity = 0; sobraFlag.style.opacity = 0;
  setTimeout(() => { indice++; mostrarStats(); disegnaCarta(); }, 180);
}

async function alternaFavorito(){
  const idx = coda[indice];
  const s = stato[idx] ? {...stato[idx]} : {};
  s.favorito = !s.favorito;
  stato[idx] = s;
  await saveStato();
  document.getElementById('pinBadge').style.display = s.favorito ? 'inline' : 'none';
  updateKeepBtn();
  mostrarStats();
}

// ============ RESOCONTO (fin de sesión) ============
function mostrarResoconto(sinPendientesDeEntrada){
  studyBox.classList.add('hidden');
  listBox.classList.add('hidden');
  resocontoBox.classList.remove('hidden');
  const c = contaDeck(currentDeckKey, stato);
  const enGiro = c.pendiente + c.proceso;
  let texto;
  if(sinPendientesDeEntrada){
    texto = enGiro === 0
      ? 'No te quedan tarjetas pendientes en este mazo.\nSi querés repasar igual, restaurá alguna desde ★ favoritas o descartadas, o reiniciá el progreso.'
      : '';
  } else {
    texto = `Sesión terminada.\n${sessionAprendidas ? sessionAprendidas + ' llegaron a 3 días y ya se consideran aprendidas.\n' : ''}Quedan ${enGiro} tarjetas en giro para la próxima.`;
  }
  document.getElementById('resocontoTexto').textContent = texto;
  document.getElementById('btnRepasar').style.display = enGiro > 0 ? 'inline-block' : 'none';
}

// ============ FAVORITAS / DESCARTADAS (listas) ============
function mostrarLista(tipo){
  studyBox.classList.add('hidden');
  resocontoBox.classList.add('hidden');
  listBox.classList.remove('hidden');
  const deck = decks[currentDeckKey];
  const ul = document.getElementById('listUl');
  ul.innerHTML = '';
  const idxs = deck.cards
    .map((_, idx) => idx)
    .filter(idx => tipo === 'favoritas' ? isFavorita(idx) : isDescartada(idx));

  document.getElementById('listTitulo').textContent = tipo === 'favoritas'
    ? `★ Favoritas (${idxs.length})`
    : `Descartadas (${idxs.length})`;
  document.getElementById('listVacio').classList.toggle('hidden', idxs.length > 0);

  idxs.forEach(idx => {
    const li = document.createElement('li');
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.innerHTML = cardLabel(currentDeckKey, idx);
    li.appendChild(txt);
    const btn = document.createElement('button');
    if(tipo === 'favoritas'){
      btn.textContent = 'quitar';
      btn.onclick = async () => {
        const s = {...stato[idx]}; delete s.favorito; stato[idx] = s; await saveStato();
        mostrarLista('favoritas'); mostrarStats();
      };
    } else {
      const s0 = stato[idx];
      btn.textContent = s0.descartada === 'sobra' ? 'la sabía de sobra' : 'no me interesaba';
      btn.title = 'Tocar para volver a incluirla en el mazo';
      btn.onclick = async () => {
        const s = {...stato[idx]}; delete s.descartada; stato[idx] = s; await saveStato();
        mostrarLista('descartadas'); mostrarStats();
      };
    }
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function cerrarLista(){
  listBox.classList.add('hidden');
  if(coda.length > 0 && indice < coda.length){
    studyBox.classList.remove('hidden');
  } else {
    mostrarResoconto(false);
  }
}

// ============ REINICIAR PROGRESO (no toca descartadas) ============
async function reiniciarProgreso(){
  const c = contaDeck(currentDeckKey, stato);
  const afectadas = c.pendiente + c.proceso + c.aprendida; // todo lo no-descartado tiene dias/favorito potencialmente
  if(!confirm('Se borra el progreso de repaso (días acertados) y las favoritas de este mazo. Las tarjetas descartadas NO se tocan. ¿Seguimos?')) return;
  for(const idx in stato){
    const s = stato[idx];
    if(!s) continue;
    const limpio = {};
    if(s.descartada) limpio.descartada = s.descartada;
    if(Object.keys(limpio).length) stato[idx] = limpio;
    else delete stato[idx];
  }
  await saveStato();
  iniciarSesion();
}

// ============ NAVEGACIÓN ============
function backToHome(){
  deckViewEl.style.display = 'none';
  homeEl.style.display = 'block';
  renderHome();
}

document.getElementById('btnNo').addEventListener('click', () => rispondi('no'));
document.getElementById('btnSi').addEventListener('click', () => rispondi('si'));
document.getElementById('btnSobra').addEventListener('click', () => rispondi('sobra'));
document.getElementById('btnVia').addEventListener('click', () => rispondi('via'));
document.getElementById('keepBtn').addEventListener('click', alternaFavorito);
document.getElementById('btnRepasar').addEventListener('click', iniciarSesion);
document.getElementById('btnVolverIndice').addEventListener('click', backToHome);
document.getElementById('favLink').addEventListener('click', () => mostrarLista('favoritas'));
document.getElementById('discardLink').addEventListener('click', () => mostrarLista('descartadas'));
document.getElementById('resetProgLink').addEventListener('click', reiniciarProgreso);
document.getElementById('listCerrar').addEventListener('click', cerrarLista);

card.addEventListener('click', () => { if(!dragged) toggleFlip(); });

let startX = 0, startY = 0, dragging = false, dragged = false, activePointerId = null;
card.addEventListener('pointerdown', e => {
  startX = e.clientX; startY = e.clientY;
  dragging = true; dragged = false;
  activePointerId = e.pointerId;
  try { card.setPointerCapture(e.pointerId); } catch(err) {}
});
card.addEventListener('pointermove', e => {
  if(!dragging || e.pointerId !== activePointerId) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  if(Math.abs(dx) > 10 || Math.abs(dy) > 10) dragged = true;
  if(Math.abs(dy) > Math.abs(dx) && dy < -20){
    card.style.transform = 'translateY(' + dy + 'px)';
    sobraFlag.style.opacity = Math.min(1, (-dy - 20) / 60);
    siFlag.style.opacity = 0; noFlag.style.opacity = 0;
  } else {
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx/18) + 'deg)';
    sobraFlag.style.opacity = 0;
    siFlag.style.opacity = dx > 25 ? Math.min(1,(dx-25)/60) : 0;
    noFlag.style.opacity = dx < -25 ? Math.min(1,(-dx-25)/60) : 0;
  }
});
function endDrag(e){
  if(!dragging || e.pointerId !== activePointerId) return;
  dragging = false;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  if(dy < -80 && Math.abs(dy) > Math.abs(dx)){
    rispondi('sobra');
  } else if(Math.abs(dx) > 85 && Math.abs(dx) > Math.abs(dy)){
    rispondi(dx > 0 ? 'si' : 'no');
  } else {
    card.style.transform = 'translateX(0) translateY(0)';
    siFlag.style.opacity = 0; noFlag.style.opacity = 0; sobraFlag.style.opacity = 0;
  }
}
card.addEventListener('pointerup', endDrag);
card.addEventListener('pointercancel', endDrag);

const backBtnEl = document.getElementById('backBtn');
backBtnEl.addEventListener('click', backToHome);
backBtnEl.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); backToHome(); });

document.addEventListener('keydown', (e) => {
  if(deckViewEl.style.display !== 'block' || studyBox.classList.contains('hidden')) return;
  if(e.key === 'ArrowLeft') rispondi('no');
  if(e.key === 'ArrowRight') rispondi('si');
  if(e.key === 'ArrowUp'){ e.preventDefault(); rispondi('sobra'); }
});

renderHome();
</script>
